name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang ninja-build libasound2-dev libx11-dev libxinerama-dev \
            libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb xauth
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Configure
        run: >-
          cmake -S . -B Builds -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFULLSPECTRUM_COPY_PLUGIN_AFTER_BUILD=OFF
          -DFULLSPECTRUM_USE_IPP=OFF

      - name: Build plugin formats and tests
        run: >-
          cmake --build Builds --config Release --parallel 2
          --target FullSpectrum_Standalone FullSpectrum_VST3 FullSpectrum_CLAP Tests Benchmarks

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir Builds -C Release --output-on-failure --no-tests=error

      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        run: ctest --test-dir Builds -C Release --output-on-failure --no-tests=error

# Release packaging and signing belong in a separately reviewed workflow with
# a protected environment. Pull requests never receive signing credentials.
